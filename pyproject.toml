[project]
name = "survey-assistant"
version = "0.1.0"
description = "Corpus-adaptive research QA over academic papers, with span-level citations and verified groundedness."
requires-python = ">=3.11,<3.12"
dependencies = [
    # Phase 0 only. Dependencies are added per phase, when first used —
    # not speculatively. See docs/DECISIONS.md D-001.
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "pymupdf>=1.28.2",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/survey"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
