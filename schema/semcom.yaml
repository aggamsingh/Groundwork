# Extraction schema — semantic communication corpus
#
# CHECKPOINT 2. DRAFT for the user to edit; the frozen version is theirs.
# Nothing loads this while status is `draft` — load_schema() refuses it.
#
# To freeze:  set status: frozen, set frozen_date, then say so.
#
# PROVENANCE: the controlled vocabulary below is the user's own, taken from their
# review notes (2026-09-13), not inferred by Claude. It replaces the taxonomy
# Claude induced from abstracts on 2026-09-09 — see D-011. The user has read
# these papers; the induced version had not. Where the two disagreed, the user's
# wins. Claude's contribution is the quantitative half (reported_values,
# snr_range, contradiction rules), which the notes table does not cover because
# it is a screening matrix rather than a results table.

corpus: semcom
status: draft            # draft | frozen  -- must be `frozen` to be usable
frozen_date: null        # YYYY-MM-DD, set when you freeze
schema_version: 2        # v1 was Claude-induced and is superseded

# ---------------------------------------------------------------------------
# Absence. "not reported" is a first-class value (spec §1): a paper that ran no
# SNR sweep is a different fact from one whose sweep we failed to extract, and
# both differ from a field that cannot apply. Keeping these apart is what lets a
# comparison table show an honest blank instead of a confident wrong number.
# ---------------------------------------------------------------------------
absence_values:
  not_reported:    The paper does not state this. A fact about the paper.
  not_applicable:  Cannot apply to this paper. Written `n/a` in the user's notes.
  not_extracted:   Extraction failed or was low-confidence. A fact about us,
                   never shown as an answer -- it triggers abstention.

value_envelope:
  value:      the extracted value, or one of absence_values
  span:       [paragraph_id, char_start, char_end]   # see D-003
  confidence: float 0-1
  verbatim:   the exact source text the value was read from

# ---------------------------------------------------------------------------
# SCREENING FIELDS — the user's controlled vocabulary, verbatim.
# These are the columns of the gold comparison table.
# ---------------------------------------------------------------------------
fields:

  - name: type
    type: enum
    cardinality: one
    description: What kind of paper this is.
    values:
      - foundation
      - system
      - metric
      - theory
      - survey
      - survey-mini        # <= 6 pages
      - vision             # position / outlook paper
    notes: >
      `survey-mini` is decidable from page count, which the parser has for free.

  - name: modality
    type: enum
    cardinality: one
    values: [text, image, speech, video, multimodal, n/a]

  - name: encoder
    type: enum
    cardinality: one
    description: How the semantic encoder was obtained.
    values:
      - scratch            # trained from scratch
      - frozen-pt          # frozen pretrained
      - finetuned-pt
      - LLM
      - n/a

  - name: channel
    type: enum
    cardinality: one
    values: [AWGN, Rayleigh, Rician, AWGN+Rayleigh, none, real]
    notes: >
      `AWGN+Rayleigh` is a single value, not two -- papers that evaluate under
      both are a distinct group from those using either alone, and splitting it
      would lose that.

  - name: transmission
    type: enum
    cardinality: one
    values: [analog, scalar-quant, vector-quant, n/a]

  - name: ch_aware_train
    type: enum
    cardinality: one
    description: Was the channel included in the training loop?
    values: [yes, no, partial, n/a]

  - name: metric_validated
    type: enum
    cardinality: one
    description: >
      Does the paper check that its metric predicts actual output quality?
    values: [yes, no, partial]
    priority: critical
    notes: >
      THE MOST IMPORTANT FIELD IN THIS SCHEMA. It is the spine of the survey's
      Section IV, and it is also the hardest to extract: papers rarely state it
      outright. It has to be inferred from whether a correlation study, human
      evaluation, or downstream-task check was actually run.
      Consequences of that combination, both deliberate:
        - It is the field to report extraction accuracy on SEPARATELY. A headline
          accuracy averaged over ten easy enums would hide failure here entirely.
        - Its abstention threshold is deliberately strict (see below). A wrong
          `yes` propagates into the survey's central argument, where a `not_extracted`
          merely sends the user to read the paper -- which they would do anyway.
    extraction_hints:
      - Look for correlation against human judgement, MOS, or a downstream task.
      - A paper that merely *reports* a metric has not validated it.
      - Absence of evidence is `no`, not `not_reported` -- the user's vocabulary
        has no `not_reported` here, because not validating is itself the finding.

  - name: failure_mode
    type: enum
    cardinality: one
    description: How the system degrades as conditions worsen.
    values: [graceful, collapse, threshold, not-discussed]
    notes: >
      `not-discussed` is a real value, not a gap -- most papers do not discuss it,
      and that silence is itself reportable.

  # --- Fields the parser supplies, needed for sorting and citation ---
  - name: year
    type: int
    cardinality: one
    notes: >
      From the parsed document, NOT PDF creation dates -- those proved to be
      download dates for several papers in this corpus.

  - name: venue
    type: string
    cardinality: one

  - name: architecture
    type: string
    cardinality: many
    description: The paper's own name for its system, where it has one.
    examples: [DeepSC, R-DeepSC, BVCS]

  - name: dataset
    type: string
    cardinality: many
    examples: [European Parliament, Flickr30k, CIFAR-10]

  # --- Quantitative fields. Not in the user's screening matrix, which is a
  # --- triage table; required here by spec §1 (numeric extraction, comparison
  # --- tables, contradiction surfacing).
  - name: snr_range
    type: numeric_range
    cardinality: one
    unit: dB
    representation: {min: float, max: float, step: float or null}
    extraction_hints:
      - Figures are a non-goal, so an SNR range appearing ONLY in a plot and
        never in text or a table is `not_reported`, not a guess.

  - name: metrics
    type: enum
    cardinality: many
    values:
      - bleu
      - sentence_similarity
      - bert_score
      - cosine_similarity
      - msssim
      - psnr
      - ssim
      - word_error_rate
      - accuracy
      - mutual_information
      - mse
      - latency
      - throughput
      - energy_efficiency
      - spectral_efficiency
      - bandwidth_compression_ratio

  - name: reported_values
    type: record
    cardinality: many
    description: >
      Individual numeric results. One record per (metric, condition) pair, NOT
      per metric -- the same metric is reported at many SNRs.
    record_fields:
      metric:         one of the `metrics` values
      metric_variant: BLEU n-gram order (1/2/3/4), or the specific similarity
                      model. `not_reported` when unstated.
      value:          float
      snr_db:         float or not_applicable
      channel:        one of the `channel` values
      transmission:   one of the `transmission` values
      channel_uses_per_symbol: float or not_reported
      dataset:        string
      system:         which system the number belongs to
      is_baseline:    bool
    notes: >
      `system` and `is_baseline` matter more than they look: papers report their
      own numbers beside reimplemented baselines, and attributing a baseline's
      score to the paper proposing it is the likeliest numeric error mode.

  - name: limitations
    type: string
    cardinality: many
    description: Limitations the paper states about ITSELF. Stated, not inferred.

# ---------------------------------------------------------------------------
# HUMAN-ONLY COLUMNS — present in the gold table, never extracted.
#
# These are the user's editorial judgements about their own argument, not
# properties of the papers. The system must not produce them and must not be
# scored on them: grading a model for failing to guess "we argue with it" would
# depress every accuracy number for no reason and hide real failures.
# ---------------------------------------------------------------------------
human_only_columns:
  verdict:
    values: [core, support, context, background, discard]
    meaning:
      core:       we argue with it
      support:    evidence for us
      context:    cite once
      background: background
      discard:    discard
  status:
    values: [todo, p1, p2, p3, done]
    meaning: {p1: pass 1 done}

# ---------------------------------------------------------------------------
comparison_table_default_columns:
  - type
  - modality
  - encoder
  - channel
  - transmission
  - ch_aware_train
  - metric_validated
  - failure_mode

# ---------------------------------------------------------------------------
# Abstention. Per-field thresholds: below this confidence, emit `not_extracted`
# and abstain rather than guess.
# ---------------------------------------------------------------------------
abstention_thresholds:
  metric_validated: 0.85     # strict on purpose -- see that field's notes
  failure_mode:     0.75
  ch_aware_train:   0.75
  default:          0.60

# ---------------------------------------------------------------------------
# Contradiction: only numeric results, and only when the setup matches.
# Two different BLEU scores at different SNRs are two facts, not a disagreement.
# ---------------------------------------------------------------------------
contradiction:
  comparable_on: reported_values
  setup_must_match:
    - metric
    - metric_variant
    - dataset
    - channel
    - transmission
    - snr_db
    - channel_uses_per_symbol

  # Per-metric absolute tolerances, not a flat relative threshold: BLEU and
  # similarity are bounded on [0,1] and cluster high, so 10% relative on 0.90
  # tolerates a 0.09 gap -- enormous here. PSNR is dB on an unbounded scale where
  # 10% of 30 dB is 3 dB, far past any real conflict. Relative tolerance is only
  # meaningful for ratio-scale quantities, so only those keep it.
  tolerance:
    bleu:                 0.02
    sentence_similarity:  0.02
    bert_score:           0.02
    cosine_similarity:    0.02
    accuracy:             0.02
    word_error_rate:      0.02
    ssim:                 0.01
    msssim:               0.01
    psnr:                 0.5        # dB
    mse:                  relative_0.10
    mutual_information:   relative_0.10
    spectral_efficiency:  relative_0.10
    bandwidth_compression_ratio: relative_0.10
    latency:              relative_0.20
    throughput:           relative_0.20
    energy_efficiency:    relative_0.20
  default_tolerance: relative_0.10
  # TODO(user): the 0.02 BLEU figure decides how often the contradiction view
  # fires. Worth a sanity check before freezing.
